<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ─── Primary SEO ─── -->
  <title>Skin of Korea | Luxury Authentic Korean Skincare</title>
  <meta name="description" content="Shop authentic Korean skincare at Skin of Korea. Discover curated luxury K-beauty bestsellers and cult-favourite essentials." />
  <meta name="keywords" content="Skin of Korea, Korean skincare, K-beauty, luxury Korean beauty, skincare routine" />
  <meta name="author" content="Skin of Korea" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="googlebot" content="index, follow" />

  <!-- ─── Open Graph / Facebook ─── -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Skin of Korea" />
  <meta property="og:title" content="Skin of Korea | Luxury Authentic Korean Skincare" />
  <meta property="og:description" content="Shop authentic Korean skincare and find your routine with Skin of Korea." />
  <meta property="og:image" content="/images/skin-of-korea-logo.png" />
  <meta property="og:image:alt" content="Skin of Korea" />
  <meta property="og:locale" content="en_GB" />

  <!-- ─── Twitter Card ─── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Skin of Korea | Luxury Authentic Korean Skincare" />
  <meta name="twitter:description" content="Shop authentic Korean skincare and find your routine with Skin of Korea." />
  <meta name="twitter:image" content="/images/skin-of-korea-logo.png" />

  <!-- ─── Mobile & PWA ─── -->
  <meta name="theme-color" content="#c59b27" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Skin of Korea" />

  <!-- ─── Performance & Preconnect Hints ─── -->
  <link rel="preconnect" href="https://cdn.shopify.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.shopify.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="dns-prefetch" href="https://img.youtube.com" />
  <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/png" href="/images/skin-of-korea-logo.png" />
  <link rel="apple-touch-icon" href="/images/skin-of-korea-logo.png" />

  <!-- ─── Global JSON-LD ─── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "#organization",
        "name": "Skin of Korea",
        "logo": "/images/skin-of-korea-logo.png",
        "image": "/images/skin-of-korea-logo.png",
        "description": "Skin of Korea brings luxury, authentic Korean skincare to customers worldwide."
      },
      {
        "@type": "WebSite",
        "@id": "#website",
        "name": "Skin of Korea",
        "publisher": { "@id": "#organization" }
      }
    ]
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
